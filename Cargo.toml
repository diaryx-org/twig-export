[package]
name = "twig-export"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Render Twig document ASTs to Typst and PDF, with a configurable directive/metadata style map."
repository = "https://github.com/diaryx-org/twig-export"
# `twig-doc` needs 1.88 and fig 1.88; typst 0.15 needs 1.92. Track the
# highest.
rust-version = "1.92"

[features]
default = ["pdf", "network"]
# Link the Typst compiler in-process so `-o out.pdf` needs no external
# toolchain. Off by default in CI's fast lane: without it the crate still
# emits `.typ`, which is where all the interesting logic lives and where every
# golden test runs.
pdf = ["dep:typst", "dep:typst-pdf", "dep:typst-kit", "dep:typst-layout"]
# Typst's HTML export, via `typst-html`. Off by default, unlike `pdf`: Typst
# itself calls HTML export "under active development and incomplete" and
# refuses to compile to it without this flag set explicitly. See src/html.rs.
html = ["dep:typst", "dep:typst-html", "dep:typst-kit"]
# Resolve `@preview/...` imports — Typst Universe templates and libraries —
# the same way typst-cli does: local package data/cache directories first,
# then a download from packages.typst.org cached under the system cache dir.
# Only takes effect alongside `pdf` and/or `html`, since those are what link a
# `World` at all; `network` on its own changes nothing.
network = ["dep:typst-kit", "typst-kit/system-files", "typst-kit/system-downloader"]

[dependencies]
# The document AST. Published as `twig-doc`; imported as `twig`. twig 7 is
# pure Rust and its core names no language: each format twig-export reads is
# a crate of its own whose `format()` registers it on first use.
#
# Default features off: twig-doc's `fig` feature is `twig::meta` (unused here —
# frontmatter is read off the AST's `metadata` node, see src/meta.rs) and a
# document's `twig` frontmatter key choosing its own parse features, which
# would let a document turn on syntax the command line did not ask for.
twig-doc = { version = "7", default-features = false }
twig-markdown = "7"
twig-djot = "7"
twig-html = "7"
twig-xml = "7"
# Parses the config file AND the frontmatter. `metadata.lang` names exactly the
# languages fig speaks, so one parser covers both. fig's core names no
# language (6.0): each is a crate that registers it, brought here without its
# own `serde` feature since typed deserialization goes through
# `fig::from_slice` in a format handle, behind fig's `serde`.
fig = { version = "7", features = ["serde"] }
fig-yaml = { version = "7", default-features = false, features = ["fig"] }
fig-json = { version = "7", default-features = false, features = ["fig"] }
fig-toml = { version = "7", default-features = false, features = ["fig"] }
fig-zon = { version = "7", default-features = false, features = ["fig"] }
fig-figl = { version = "7", default-features = false, features = ["fig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A picture given as a `data:` URL, decoded into the bytes `#image` reads.
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# Typst from diaryx-org's fork: upstream v0.15.1 plus two patches, a public
# `Span::from_range` and `typst::compile_with`, which lay out content built
# from the twig tree under a Typst template. Its `PATCH.md` lists them, and
# docs/proposals/typst-is-forked-and-kept-under-markdown.md argues the
# fork. Every Typst crate comes from it, so the graph holds one Typst; a
# consumer that links Typst itself names the same source.
typst = { git = "https://github.com/diaryx-org/typst", branch = "twig", optional = true }
typst-pdf = { git = "https://github.com/diaryx-org/typst", branch = "twig", optional = true }
typst-kit = { git = "https://github.com/diaryx-org/typst", branch = "twig", optional = true, features = ["scan-fonts", "embedded-fonts"] }
# `PagedDocument` — what `typst::compile` produces and `typst_pdf::pdf` takes —
# lives here and is not re-exported by the `typst` facade.
typst-layout = { git = "https://github.com/diaryx-org/typst", branch = "twig", optional = true }
typst-html = { git = "https://github.com/diaryx-org/typst", branch = "twig", optional = true }
# 0.5 is on fig 7. The library alone: its default `cli` feature is the
# command line.
fig-schema = { version = "0.5", default-features = false }

[lib]
name = "twig_export"
path = "src/lib.rs"

[[bin]]
name = "twig-export"
path = "src/main.rs"
